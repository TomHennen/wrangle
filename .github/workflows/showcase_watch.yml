name: Showcase Watch

# Unattended heartbeat (#839): the wrangle-test showcase runs on tag pushes,
# invisible unless someone checks its Actions tab, so this polls the latest
# completed tracking-tag run on a schedule and keeps a `wrangle-alert` issue
# in sync via tools/run_scheduled_check.sh — raised on red, closed on green.
# Read-only against wrangle-test (a public repo's Actions API needs no
# elevated token); `issues: write` here is only for wrangle's own alert issue.

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # tools/wrangle_alert.sh files/clears a wrangle-alert issue.
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check the wrangle-test showcase (and keep the wrangle-alert issue in sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/run_scheduled_check.sh showcase "wrangle-test showcase is red" ./tools/check_showcase_run_green.sh
