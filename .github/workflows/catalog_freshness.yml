name: Catalog Freshness

# Advisory adoption-lag check (#596): weekly, compares each curated tool-image
# digest in tools/catalog.json against its :latest tag in the registry. A drift
# means a newer tool image was published but the catalog still pins the old one.
# Kept off the per-PR path to avoid per-PR registry calls; the same check is a
# release precondition (see the cut-release runbook). Advisory first because it
# depends on a live registry (network/registry flake), unlike the deterministic
# git-only pin checks which block directly — a failed run notifies. The blocking
# release precondition is release_gate.yml, which runs the same check
# fail-closed on exit 2.
#
# A real failure (exit 1) files a `wrangle-alert` issue via tools/run_scheduled_check.sh (#839); exit 2 only warns.

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # tools/wrangle_alert.sh files/clears a wrangle-alert issue.
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check catalog image freshness (and keep the wrangle-alert issue in sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/run_scheduled_check.sh catalog-freshness "Catalog freshness check is red" ./tools/check_catalog_freshness.sh
