name: Catalog Provenance Freshness

# Weekly advisory that each published tool image was built from current source.
# release_gate.yml runs the same check fail-closed as the release gate.
#
# Nobody watches this workflow's runs (#839), so a real failure (exit 1) files
# a `wrangle-alert` issue via tools/run_scheduled_check.sh; a green run closes
# it. A registry/Sigstore blip (exit 2) only warns — see that script's header.

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  provenance-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # tools/wrangle_alert.sh files/clears a wrangle-alert issue.
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0   # the diff needs each image's build commit in history

      - name: Check catalog image provenance freshness (and keep the wrangle-alert issue in sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/run_scheduled_check.sh catalog-provenance-freshness "Catalog provenance freshness check is red" ./tools/check_catalog_provenance_freshness.sh
