name: Release Gate

# Blocking release precondition (#596): `tools/cut_release.sh` dispatches this on
# the release target and refuses to go on unless it is green, and release.yml's
# tag job re-reads its conclusion on that exact commit before publishing.
# It runs tools/release_preflight.sh, which sequences every code-level gate — the
# catalog checks, plus whether the wrangle-test showcase's latest completed
# tracking-tag run was green (#839) — fail-closed. Any non-zero blocks: exit 1
# (a digest is stale/behind :latest, or the watched showcase run is red) and
# exit 2 (backend unreachable = precondition UNVERIFIED) alike. This is the
# opposite polarity to the weekly advisories (catalog_freshness.yml,
# catalog_provenance_freshness.yml), which warn on exit 2 so a transient blip
# can't page — correct for a heads-up, wrong for a gate. Those two freshness
# checks are deliberately not re-gated by run history (see release_preflight.sh).
#
# Dispatch-only on purpose: a push/tag trigger would run after the tag exists
# (too late to block) and paint a transient exit-2 red X on an already-cut,
# legitimately-vetted release.

on:
  workflow_dispatch:

permissions: {}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Provenance freshness diffs each image's build commit against HEAD.
          fetch-depth: 0

      - name: Release preflight (catalog, fail-closed)
        env:
          # Provenance freshness reads each image's build attestation; the
          # cross-repo showcase read needs no extra permission (public API).
          GH_TOKEN: ${{ github.token }}
        run: ./tools/release_preflight.sh
