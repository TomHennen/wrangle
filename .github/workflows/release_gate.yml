name: Release Gate

# Blocking release precondition (#596): the operator runs this by hand before
# `gh release create` (cut-release runbook Phase 3) and cuts only on a green run.
# It runs tools/release_preflight.sh, which sequences every code-level gate — the
# catalog checks, plus whether the wrangle-test showcase's latest completed
# tracking-tag run was green (#839) — fail-closed. Any non-zero blocks: exit 1
# (a digest is stale/behind :latest, or the watched showcase run is red) and
# exit 2 (backend unreachable = precondition UNVERIFIED) alike. This is the
# opposite polarity to the weekly advisories (catalog_freshness.yml,
# catalog_provenance_freshness.yml), which warn on exit 2 so a transient blip
# can't page — correct for a heads-up, wrong for a gate. Those two freshness
# checks are deliberately NOT re-gated by run history here — see
# tools/release_preflight.sh's header for why.
#
# Dispatch-only on purpose: there is no automated release/tag workflow to hook
# (releases are a manual `gh release create` against an immutable tag), and a
# push/tag trigger would run after the tag exists (too late to block) and paint a
# transient exit-2 red X on an already-cut, legitimately-vetted release.

on:
  workflow_dispatch:

permissions: {}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Provenance freshness diffs each image's build commit against HEAD.
          fetch-depth: 0

      - name: Release preflight (catalog, fail-closed)
        env:
          # Provenance freshness reads each image's build attestation. The
          # showcase run-status gate lists wrangle-test's runs cross-repo,
          # which needs no `actions:` permission here: it's a public repo's
          # Actions API, readable by any authenticated (or unauthenticated)
          # caller, and permissions: only scopes this token's OWN repo.
          GH_TOKEN: ${{ github.token }}
        run: ./tools/release_preflight.sh
