name: Build Shell

# Wrangle dogfooding its own shell build type: source scan + shellcheck over
# the whole tree + every bats suite (unit and integration; real binaries +
# network, installed by the setup-script). Subsumes the standalone scan
# trigger — build_shell.yml embeds the same scan job.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel superseded PR runs; the run_id fallback keeps each main/tag push in its own group (never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-shell:
    permissions:
      actions: read
      contents: read
      security-events: write
    # ./ resolves to this repo at the PR branch ref, so PR CI tests
    # the actual code in the PR (not main).
    uses: ./.github/workflows/build_shell.yml
    with:
      # bats-path is left empty on purpose: auto-detect runs EVERY .bats in
      # the tree — unit and integration suites alike — with their tool
      # dependencies installed by the setup script.
      setup-script: test/setup_integration.sh
      # Fan the bats suite out across the runner's cores (ubuntu-latest: 4).
      bats-jobs: "4"
      # Cache the Go tools built from source: go-tools-dir for the
      # setup-script's tools in the shell-build job. cache-setup-tools also
      # caches the linked tool binaries so they aren't relinked when go.sum
      # is stable.
      go-tools-dir: tools
      cache-setup-tools: enabled
      # Cross-run layer cache for the tool images the setup script prebuilds.
      image-cache: enabled
    # The integration bats include the pull-time VSA gate's real-gh test
    # (test/image/test_verify_tool_image_real_gh.bats); gh needs a token to
    # read the public attestation. The job's own read-only token suffices.
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  # Wrangle-internal, so it lives in the dogfood caller rather than the
  # reusable build_shell.yml.
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Static catalog hygiene (#596): every curated tool image is digest-pinned
      # on the wrangle namespace and capabilities are default-closed. Network-free,
      # so it runs every PR; the registry adoption-lag check is a release gate.
      - name: Validate tool catalog
        run: ./tools/check_catalog.sh

  # On a catalog-only change, green means the change is exactly what
  # bump_catalog_to_latest.sh produces against the registry — the one case
  # CLAUDE.md lets merge without an owner LGTM. A wider change is out of scope:
  # it passes here and still needs the LGTM.
  catalog-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The base ref's copy decides scope, so a change that also rewrites the
      # check, the bump script or the catalog reader cannot vouch for itself.
      - name: Verify catalog bump reproducibility
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base-ref" "$BASE_REF"
          check="$RUNNER_TEMP/base-ref/tools/check_catalog_bump_pr.sh"
          # A base ref that ships no check grants no exception, so say so and pass.
          [[ -x "$check" ]] || { printf 'base ref has no catalog-bump check; normal review applies\n'; exit 0; }
          "$check" "$BASE_REF" "$HEAD_REF"
