name: Release

# Cut a wrangle release tag. `tools/cut_release.sh` dispatches this after its own
# prechecks; the `release` environment then holds the tag job at "Waiting for
# review" until the repository owner approves the deployment — that approval is
# the human gate on an irreversible step, so the job re-verifies every
# precondition itself instead of trusting the dispatcher or the preview job.
#
# The preview job runs before the gate and renders what approving would publish,
# so the approver reads the version, the commit and the notes on the run page
# rather than taking the dispatcher's word for them.
#
# After the Release is published, the companion repo's curated showcase runs at
# the new tag: the only thing that exercises a wrangle release the way adopters
# do (a `refs/tags/` signer identity, which the strict consumer policy requires).
# It detects, it cannot prevent — the tag is immutable, so a failure fails this
# run red and the remedy is the next patch release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to cut (vX.Y.Z)
        required: true
        type: string
      target:
        description: Commit to tag (40-character hex sha on main)
        required: true
        type: string
      dry-run:
        description: Verify only — unset this to publish the Release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read     # read the Release Gate run's conclusion on the target
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The target's ancestry and its release-notes blob are read from local
          # history — no job checks the target out.
          fetch-depth: 0

      - name: Verify the target and render what approval publishes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: ./tools/release_tag.sh "$VERSION" "$TARGET" --preview

  tag:
    needs: [preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write   # gh release create
      actions: read     # read the Release Gate run's conclusion on the target
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the target and publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          RELEASE_DRY_RUN: ${{ inputs['dry-run'] }}
        run: ./tools/release_tag.sh "$VERSION" "$TARGET"

  showcase:
    needs: [tag]
    if: ${{ !inputs['dry-run'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: integration-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run the companion showcase at the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          # The companion tag must be pushed by a PAT: a GITHUB_TOKEN-created tag
          # does not fire the companion's `on: push: tags` workflow.
          COMPANION_PUSH_TOKEN: ${{ secrets.TEST_REPO_PAT }}
          VERSION: ${{ inputs.version }}
        run: ./test/integration/run_release_showcase.sh "$VERSION"
