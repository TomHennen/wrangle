# osv-scanner native config for manifests in this directory (tools/go.mod).
# Discovered by the scanner itself — wrangle's scan adapter adds nothing.
# Every entry is an advisory no version bump clears, and each `reason` carries
# the full justification (the scanner prints it on every filtered finding). The
# shared `ignoreUntil` is a forced-revisit tripwire: once it passes the scan
# resurfaces every entry, so a suppression is re-decided, never inherited.

[[IgnoredVulns]]
id = "GO-2026-6225"
ignoreUntil = 2027-02-22T00:00:00Z
reason = "docker-credential-acr-env (an Azure ACR credential helper linked into cosign) has no patched version: every version is affected and the module has a single 2023 pseudo-version with no fix upstream. The flaw sends an Azure AD token to any host whose name contains .azurecr.io. It is not exploitable here: cosign reaches a registry only from the attest toolbox, whose environment is an explicit allowlist carrying no Azure credentials, and it contacts only the registry the adopter names. Remove this entry when cosign drops the dependency or a fixed version ships."
